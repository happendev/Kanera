packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  argon2: true
  # PostHog's transitive core-js install hook is optional; keep dependency installs reproducible.
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  ttf2woff2: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - vite@8.1.5
  - ws@8.21.0
  - body-parser@2.3.0
  - linkify-it@5.0.2
  - svgo@3.3.4
  - '@angular/common@22.1.1'
  - '@angular/compiler-cli@22.1.1'
  - '@angular/compiler@22.1.1'
  - '@angular/core@22.1.1'
  - '@angular/forms@22.1.1'
  - '@angular/platform-browser@22.1.1'
  - '@angular/router@22.1.1'
  - '@angular/service-worker@22.1.1'
  - blobatar@0.2.0
minimumReleaseAgeExcludePrune: true
overrides:
  # Keep Vite aligned with @angular/build: its dev-server linker depends on the matching
  # dependency-optimizer API, and an older forced Vite leaves Angular packages partially compiled.
  '@hono/node-server': 2.1.0
  esbuild: 0.28.1
  piscina: 5.3.0
  shell-quote: 1.10.0
  undici: 7.29.0
  ws: 8.21.0
