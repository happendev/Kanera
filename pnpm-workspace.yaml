packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  argon2: true
  # PostHog's transitive core-js install hook is optional; keep dependency installs reproducible.
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  ttf2woff2: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - ws@8.21.0
  - linkify-it@5.0.2
minimumReleaseAgeExcludePrune: true
