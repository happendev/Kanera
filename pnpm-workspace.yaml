packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  argon2: true
  # PostHog's transitive core-js install hook is optional; keep dependency installs reproducible.
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  ttf2woff2: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - ws@8.21.0
  - linkify-it@5.0.2
minimumReleaseAgeExcludePrune: true
overrides:
  # Vite follows @angular/build: its dev-server linker depends on the matching optimizer API.
  # These security pins stay within each dependency's current major.
  '@hono/node-server': 2.1.6
  esbuild: 0.28.1
  piscina: 5.3.2
  shell-quote: 1.12.0
  undici: 7.30.1
  ws: 8.21.0
  # Sass and css-tree still pin the vulnerable patch; preserve its API while fixing source-map parsing.
  source-map-js: 1.2.2
  # Angular's Oxc Wasm fallback pins emnapi alpha; newer runtimes require the beta ABI.
  '@oxc-parser/binding-wasm32-wasi>@napi-rs/wasm-runtime': 1.2.2
