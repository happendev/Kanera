# Cache policy is computed here and applied with a single `add_header` in the static locations below,
# rather than as a per-location header. nginx drops *every* inherited `add_header` the moment a
# location declares one of its own, so introducing a dedicated `location /media/` for the fonts would
# silently strip the CSP and the rest of the security headers from font responses. One map keeps both
# concerns in one place. This file is copied to conf.d/default.conf, which nginx includes at http
# level, so `map` must sit outside the server block.
#
# Everything Angular emits under /media/ and every root-level bundle is content-hashed, so those are
# safe to serve `immutable`: changing a file changes its filename, which makes a stale entry
# unreachable rather than wrong. This is what keeps the self-hosted Inter woff2 out of the request
# path entirely — at the browser and at the Cloudflare edge — across both repeat visits and releases,
# since an unchanged font keeps its hashed URL from one deploy to the next.
#
# The service worker control files must stay revalidated. ngsw.json is how a client discovers that a
# new version exists; caching it would pin browsers to an old release with no way to recover.
# index.html is served from `location /` and falls through to the same default.
map $uri $kanera_cache_control {
  default                            "no-cache";
  ~^/media/                          "public, max-age=31536000, immutable";
  # Quoted because nginx otherwise reads the regex's {8} as a config block delimiter.
  "~^/[^/]+-[A-Z0-9]{8}\.(?:js|css)$"  "public, max-age=31536000, immutable";
  # Favicons, logos and perf fixtures are referenced by stable unhashed paths, so they can only take
  # a bounded TTL — long enough to stop refetching on every navigation, short enough that replacing a
  # logo actually ships.
  ~^/assets/                         "public, max-age=86400";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 110m;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3000;

  location = /health {
    add_header Content-Type text/plain;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self "https://js.stripe.com"), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()' always;
    return 200 "ok\n";
  }

  # Missing hashed bundles and other extensionful assets must 404 instead of
  # falling back to index.html, or browsers report HTML-as-JS module errors.
  location ~ ^/(?!api/|socket\.io/|public-api/).+\.[A-Za-z0-9]+$ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; frame-src blob: https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com; worker-src 'self'; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self "https://js.stripe.com"), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()' always;
    add_header Cache-Control $kanera_cache_control always;
    try_files $uri =404;
  }

  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # PDF previews are fetched with auth and converted to an object URL before being framed.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; frame-src blob: https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com; worker-src 'self'; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self "https://js.stripe.com"), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()' always;
    # Navigations resolve to index.html, which must always revalidate so a deploy is picked up.
    add_header Cache-Control $kanera_cache_control always;
    try_files $uri $uri/ /index.html;
  }

  # Public API (docs, webhooks, public endpoints) proxied to the public-api container.
  location /public-api/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self "https://js.stripe.com"), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()' always;
    proxy_pass http://public-api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 30s;
    proxy_read_timeout 2m;
    proxy_send_timeout 2m;
  }

  # API + Socket.IO proxied to the api container.
  location /api/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self "https://js.stripe.com"), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()' always;
    # `proxy_pass` with a variable upstream and a URI suffix proxies the literal
    # suffix, so strip /api explicitly before handing the request to Fastify.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_path /auth /api/auth;
    proxy_connect_timeout 30s;
    proxy_read_timeout 2m;
    proxy_send_timeout 2m;
  }

  location /socket.io/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self "https://js.stripe.com"), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()' always;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }
}
