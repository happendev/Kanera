<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Kanera</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kanera" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Inter is self-hosted via @fontsource-variable/inter (wired through angular.json styles), not
       loaded from the Google Fonts CDN. Bundling it is what fingerprints the woff2 into media/ so the
       service worker precaches it and the PWA renders correctly offline; it also keeps
       font-src 'self' in the CSP and avoids disclosing visitor IPs to a third party. -->

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png" />

  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="60x60" href="/assets/favicon/apple-touch-icon-60x60.png" />
  <link rel="apple-touch-icon" sizes="76x76" href="/assets/favicon/apple-touch-icon-76x76.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/favicon/apple-touch-icon-120x120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/favicon/apple-touch-icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon-180x180.png" />

  <link rel="mask-icon" href="/assets/favicon/safari-pinned-tab.svg" color="#14b8a6" />
  <link rel="manifest" href="/assets/favicon/manifest.json" />

  <meta name="msapplication-config" content="/assets/favicon/browserconfig.xml" />
  <meta name="theme-color" content="#0b111b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />

  <!-- Set the theme and accent before first paint so the app never flashes the wrong colours and
       the OS preference is honored on first load (Angular boots after parse, too late to avoid the
       flash). Mirrors ThemeService.getInitial()/getInitialAccent(); the 'kanera-theme' and
       'kanera-accent' keys are STORAGE_KEYS.THEME/ACCENT, kept in sync intentionally. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kanera-theme');
        if (['light', 'paper', 'dark', 'carbon'].indexOf(t) === -1) {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('kanera-accent');
        if (['default', 'blue', 'green', 'violet', 'pink', 'graphite'].indexOf(a) === -1) a = 'default';
        // Blue and Green are one slot whose occupant depends on the theme (THEME_COOL_ACCENT in
        // theme.service.ts). ThemeService keeps storage consistent, but a cross-tab write can land
        // out of order; resolving it here too means no flash of the wrong accent on boot.
        if (a === 'blue' && t === 'carbon') a = 'green';
        else if (a === 'green' && t !== 'carbon') a = 'blue';
        document.documentElement.dataset.accent = a;
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <k-root></k-root>
</body>

</html>
