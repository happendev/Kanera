<header class="panel-head">
  <i class="ti ti-list-numbers"></i>
  <h3 i18n="Name of the personal priority queue panel">Up next</h3>
  <!-- No "N of 50" readout: the cap only matters when it is hit, and the capacity note below
       says so then. The toggle button in the page chrome already carries the count. -->
  @if (targetName(); as name) {
    <span class="panel-target" [kTooltip]="targetTooltip(name)">{{ name }}</span>
  }
  @if (canReorder()) {
    <span class="panel-head-add-anchor">
      <button
        type="button"
        class="panel-head-tool"
        aria-label="Add card to Up next"
        i18n-aria-label
        [disabled]="atCapacity() || addableCards().length === 0"
        [kTooltip]="addTooltip()"
        (click)="headAddOpen.set(!headAddOpen())"
      >
        <i class="ti ti-plus"></i>
      </button>
      @if (headAddOpen()) {
        <k-anchored-picker
          title="Add to Up next"
          i18n-title
          [groups]="addGroups()"
          [width]="420"
          [align]="'end'"
          searchPlaceholder="Search cards…"
          i18n-searchPlaceholder
          emptyLabel="No cards can be added"
          i18n-emptyLabel
          (picked)="onHeadAddPicked($event)"
          (closed)="headAddOpen.set(false)"
        />
      }
    </span>
  }
  <button type="button" class="panel-close" aria-label="Close Up next" i18n-aria-label kTooltip="Close" i18n-kTooltip="Tooltip: close the panel" (click)="closed.emit()">
    <i class="ti ti-x"></i>
  </button>
</header>

@if (error(); as message) {
  <p class="panel-error"><i class="ti ti-alert-circle"></i>{{ message }}</p>
}

<!-- `acceptExternalCardDrops` only here: this is the one surface docked beside a board whose lanes
     name its drop list in `cdkDropListConnectedTo`. -->
<k-priority-queue
  [priorities]="priorities()"
  [catalog]="catalog()"
  [boardSummariesById]="boardSummariesById()"
  [canDrag]="canDrag()"
  [maxEntries]="maxEntries()"
  [selectedCardId]="selectedCardId()"
  [addableCards]="addableCards()"
  [editableCardIds]="editableCardIds()"
  [allowQuickComplete]="allowQuickComplete()"
  [acceptExternalCardDrops]="true"
  (reordered)="reordered.emit($event)"
  (removed)="removed.emit($event)"
  (added)="added.emit($event)"
  (cardOpened)="cardOpened.emit($event.cardId)"
  (completed)="completed.emit($event)"
/>
