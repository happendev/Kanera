<div class="gc-header">
  <h3 [class.has-color]="!!group().color" [style.--group-color]="colorToken()">
    @if (group().avatarUrl !== undefined && !group().icon) {
    <k-avatar [url]="group().avatarUrl ?? null" [name]="group().label" [size]="20" [workspaceId]="workspaceId()" />
    } @else {
    <i aria-hidden="true" [class]="'ti ti-' + (group().icon || 'square')"></i>
    }
    <span class="gc-name">{{ group().label }}</span>
    <!-- After the name: the name is what a lane is scanned for, the count a secondary fact. -->
    <span class="gc-count">{{ cardCount() }}</span>
  </h3>
  @if (canEditRole() && canCreateCards()) {
  <!-- Always mounted rather than revealed on hover: a hover-only create button is invisible on
       touch, and it is the affordance that makes a grouped column worth pointing at. -->
  <button type="button" class="gc-add-btn" [disabled]="!canEdit()" (click)="addRequested.emit(group().key)" [attr.aria-label]="addCardLabel()" [kTooltip]="addCardLabel()">
    <i aria-hidden="true" class="ti ti-plus"></i>
  </button>
  }
</div>

<div
  class="gc-cards"
  #cardsEl
  [class.gc-receiving]="receiving()"
  cdkDropList
  [cdkDropListData]="renderedCards()"
  [cdkDropListDisabled]="!canEdit() || !acceptsDrop()"
  [cdkDropListSortingDisabled]="true"
  [id]="'gc-' + group().key"
  (cdkDropListDropped)="onDrop($event)"
  (cdkDropListEntered)="onDropListEntered()"
  (cdkDropListExited)="receiving.set(false)"
>
  @for (card of renderedCards(); track card.id) {
  <k-card
    cdkDrag
    #cardDrag="cdkDrag"
    [cdkDragStartDelay]="dragStartDelay"
    [cdkDragDisabled]="!canEdit() || isBulkSelectedCard(card.id)"
    [cdkDragData]="card"
    (cdkDragStarted)="onDragStarted($event.source.element.nativeElement)"
    (cdkDragMoved)="onDragMoved($event)"
    (cdkDragEnded)="onDragEnded()"
    [card]="card"
    [customFields]="customFields()"
    [customFieldValuesByField]="customFieldValuesForCard(card.id)"
    [labels]="labelsForCard(card.id)"
    [assignees]="assigneesForCard(card.id)"
    [coverUrl]="coverUrlForCard(card)"
    [attachmentCount]="attachmentCountForCard(card.id)"
    [commentCount]="commentCountForCard(card.id)"
    [coverPriority]="$first"
    [selected]="isSelectedCard(card.id)"
    [bulkSelected]="isBulkSelectedCard(card.id)"
    [showActions]="canEditRole()"
    [sourceListsOverride]="lists()"
    [workspaceIdOverride]="workspaceId()"
    [priorityRank]="priorityRanksByCard().get(card.id) ?? null"
    (openCard)="cardOpened.emit($event)"
    (selectionIntent)="onCardSelectionIntent($event)"
    (bulkMenuIntent)="onCardBulkMenuIntent($event)"
  >
    <!-- The tile itself in drag-preview mode (see list.component.html), so nothing moves when the
         preview replaces it. -->
    <ng-template cdkDragPreview [matchSize]="true">
      <div class="card-drag-preview-frame">
        <k-card class="card-drag-preview" [dragPreview]="true" [style.--drag-cover-color]="coverColorForCard(card)" [card]="card" [customFields]="customFields()"
          [customFieldValuesByField]="customFieldValuesForCard(card.id)" [labels]="labelsForCard(card.id)" [assignees]="assigneesForCard(card.id)" [coverUrl]="coverUrlForCard(card)"
          [attachmentCount]="attachmentCountForCard(card.id)" [commentCount]="commentCountForCard(card.id)" [selected]="isSelectedCard(card.id)" [bulkSelected]="isBulkSelectedCard(card.id)"
          [showActions]="canEditRole()" [sourceListsOverride]="lists()" [workspaceIdOverride]="workspaceId()" [priorityRank]="priorityRanksByCard().get(card.id) ?? null" />
      </div>
    </ng-template>
  </k-card>
  } @empty {
  <!-- The dashed body is the drop target for an empty column; without it the column collapses and
       "drag onto the person with no work" stops being possible. -->
  <div class="gc-empty-hint" aria-hidden="true"></div>
  }
</div>
