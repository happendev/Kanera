<div class="auth-root">
  <div class="auth-card">
    <div class="auth-header">
      <k-logo [height]="34" />
      <p i18n>Reset your password</p>
    </div>
    <form (submit)="submit($event)">
      <div class="field">
        <label for="email"><i class="ti ti-mail"></i> <ng-container i18n="Field label: email address">Email</ng-container></label>
        <input id="email" type="email" [formField]="forgotPasswordForm.email" autocomplete="email" />
      </div>
      @if (turnstileSiteKey()) {
        <div class="turnstile-field">
          <div #turnstileContainer></div>
        </div>
      }
      @if (sent()) {
        <div class="success-banner"><i class="ti ti-circle-check"></i> <ng-container i18n>If that email exists, a reset link has been created.</ng-container></div>
      }
      @if (error()) {
        <div class="error-banner"><i class="ti ti-alert-circle"></i> {{ error() }}</div>
      }
      <button type="submit" [disabled]="busy()" class="submit-btn" i18n="Button">Send reset link</button>
    </form>
    <div class="auth-footer"><a routerLink="/login" i18n>Back to login</a></div>
  </div>
  <k-locale-switcher />
</div>
