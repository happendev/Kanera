<div class="auth-root">
  <div class="auth-card">
    <div class="auth-header">
      <k-logo [height]="34" />
      <p i18n>Choose a new password</p>
    </div>
    <form (submit)="submit($event)">
      <div class="field">
        <label for="password"><i class="ti ti-lock"></i> <ng-container i18n="Field label">New password</ng-container></label>
        <div class="input-wrap">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" [formField]="resetPasswordForm.password" autocomplete="new-password" />
          <button type="button" class="reveal-btn" tabindex="-1" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? hidePasswordLabel : showPasswordLabel">
            <i [class]="showPassword() ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirm"><i class="ti ti-lock-check"></i> <ng-container i18n="Field label">Confirm password</ng-container></label>
        <div class="input-wrap">
          <input id="confirm" [type]="showConfirm() ? 'text' : 'password'" [formField]="resetPasswordForm.confirm" autocomplete="new-password" />
          <button type="button" class="reveal-btn" tabindex="-1" (click)="showConfirm.set(!showConfirm())" [attr.aria-label]="showConfirm() ? hidePasswordLabel : showPasswordLabel">
            <i [class]="showConfirm() ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
          </button>
        </div>
      </div>
      @if (error()) {
        <div class="error-banner"><i class="ti ti-alert-circle"></i> {{ error() }}</div>
      }
      @if (success()) {
        <div class="success-banner"><i class="ti ti-circle-check"></i> <ng-container i18n>Password reset. Sending you back to login.</ng-container></div>
      }
      <button type="submit" [disabled]="busy()" class="submit-btn" i18n="Button">Reset password</button>
    </form>
    <div class="auth-footer"><a routerLink="/login" i18n>Back to login</a></div>
  </div>
  <k-locale-switcher />
</div>
