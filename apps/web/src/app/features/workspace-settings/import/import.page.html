<k-segmented
  class="import-source-switch"
  [options]="sourceOptions"
  [value]="source()"
  [showLabels]="true"
  ariaLabel="Import source"
  (valueChange)="setSource($any($event))"
/>

@if (source() === 'trello') {
<k-trello-import source="trello" [workspaceId]="settings.workspaceId()" [standalone]="settings.isStandalone()" [lists]="settings.lists()" [labels]="settings.labels()" [fields]="settings.fields()" [members]="settings.members()" />
} @else {
<k-trello-import source="kanera" [workspaceId]="settings.workspaceId()" [standalone]="settings.isStandalone()" [lists]="settings.lists()" [labels]="settings.labels()" [fields]="settings.fields()" [members]="settings.members()" />
}
