version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Routine container version updates are intentionally disabled. Dependabot security updates use a
  # separate PR limit, so urgent vulnerability fixes can still open PRs without weekly patch noise.
  # List each Dockerfile directory explicitly: `directory` does not glob.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/mcp
      - /apps/web
      - /docker/db-backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Major bumps change runtimes and on-disk formats (Postgres majors need pg_upgrade, Node majors
      # must move with `engines`/.nvmrc), so they stay a deliberate, hand-reviewed migration.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # nginx publishes its mainline (development) branch as ODD minor versions alongside stable EVEN
      # ones — 1.31.x is mainline, 1.30.x is stable — as ordinary 1.x.y-alpine tags. A minor bump
      # would therefore move this deployment onto mainline, so allow patch updates only. Adopting a
      # new stable branch (1.30 -> 1.32) stays a deliberate change.
      - dependency-name: "nginx"
        update-types:
          - version-update:semver-minor

  # Scans the `image:` keys in docker-compose.yml, docker-compose.dev.yml, and docker-compose.test.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Keep routine image bumps quiet while allowing Dependabot security updates to remain active.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
