name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: corepack prepare pnpm@11.23.0 --activate

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # These two suites guard release tooling and cross-file drift (the bundled Codex plugin skill
      # versus the canonical skill, and the publish-mcp workflow triggers). They only otherwise run
      # in the full local `pnpm test`, which would let drift land through CI unnoticed.
      - run: pnpm test:release

      - run: pnpm test:integrations

      - run: pnpm --filter @kanera/api test

      - run: pnpm --filter @kanera/web test

      # The MCP, CLI, and SDK packages ship to third parties (npm and the MCP registry), so their
      # suites gate every commit rather than being discovered broken at publish time. The CLI and
      # SDK tests also pack each tarball and verify a clean install of it.
      - run: pnpm test:mcp

      - run: pnpm test:cli

      - run: pnpm test:sdk

      # Bundle budgets were previously only checkable by hand, so growth went unnoticed between
      # releases. Gating here fails the commit that regresses the payload instead of a later audit.
      - run: pnpm bundle:web:check

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
