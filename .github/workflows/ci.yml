name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: corepack prepare pnpm@11.23.0 --activate

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # These two suites guard release tooling and cross-file drift (the bundled Codex plugin skill
      # versus the canonical skill, and the publish-mcp workflow triggers). They only otherwise run
      # in the full local `pnpm test`, which would let drift land through CI unnoticed.
      - run: pnpm test:release

      - run: pnpm test:integrations

      - run: pnpm --filter @kanera/api test

      - run: pnpm --filter @kanera/web test

      # The MCP, CLI, and SDK packages ship to third parties (npm and the MCP registry), so their
      # suites gate every commit rather than being discovered broken at publish time. The CLI and
      # SDK tests also pack each tarball and verify a clean install of it.
      - run: pnpm test:mcp

      - run: pnpm test:cli

      - run: pnpm test:sdk

      # This aliases the web package's standard production build, which enforces the same budgets
      # locally and in Docker so CI is not the first place bundle growth becomes visible.
      - run: pnpm bundle:web:check

  e2e-shard:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Seeded users, boards and realtime channels are shared inside a stack. Separate runners give
    # each shard its own database, Valkey, ports and services without weakening realtime coverage.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: corepack prepare pnpm@11.23.0 --activate

      - run: pnpm install --frozen-lockfile

      # Browser binaries are keyed on the pinned Playwright version; system deps still install
      # every run because apt packages are not part of the cached directory.
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required check name stable. A failed or cancelled shard must fail this gate;
  # without always(), GitHub would skip it when a dependency fails instead of reporting a failure.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every E2E shard to pass
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "E2E shards did not all pass: $SHARD_RESULT"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
